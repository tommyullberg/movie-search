<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <!-- Cinema Dark Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Film Strip Outer Body -->
  <rect x="5.5" y="6" width="21" height="20" rx="3" fill="url(#stripGrad)" stroke="#3f3f46" stroke-width="1"/>

  <!-- Sprocket Holes - Left Column -->
  <rect x="7" y="8" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="7" y="12" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="7" y="16" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="7" y="20" width="2" height="2" rx="0.5" fill="#4ade80"/>

  <!-- Sprocket Holes - Right Column -->
  <rect x="23" y="8" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="23" y="12" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="23" y="16" width="2" height="2" rx="0.5" fill="#4ade80"/>
  <rect x="23" y="20" width="2" height="2" rx="0.5" fill="#4ade80"/>

  <!-- Center Screen Frame -->
  <rect x="10.5" y="8" width="11" height="14" rx="1.5" fill="#09090b" stroke="#22c55e" stroke-width="0.75" stroke-opacity="0.6"/>

  <!-- Vibrant Cinema Play Glyph -->
  <polygon points="14,11.5 19,15 14,18.5" fill="url(#primaryGrad)"/>
</svg>
